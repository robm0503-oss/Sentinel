<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Sentinel</title>
<script src="capacitor.js"></script>
<!-- Sentinel Haus-System v6 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sentinel Tablet – das ganze Tablet ist der Kopf */
:root {
  --bg: #000;
  --bar: #0e1114;
  --line: #23292f;
  --text: #e7e4dc;
  --muted: #858a90;
  --eye: #ffb547;
  --bad: #ff6b5f;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--display); overflow: hidden; -webkit-tap-highlight-color: transparent; }

.app {
  height: 100%; display: flex; flex-direction: column; gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
canvas#face { display: block; height: 100%; max-height: 100%; aspect-ratio: 1; max-width: 100%; touch-action: none; cursor: pointer; }
.top {
  position: absolute; top: 4px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font: .72rem var(--mono); color: var(--muted); letter-spacing: .06em;
}
.tbtns { display: flex; gap: 6px; }
.ghost { background: none; border: 1px solid var(--line); color: var(--muted); font: .7rem var(--mono); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.say { min-height: 2.6em; max-height: 6.5em; overflow-y: auto; text-align: center; font-size: clamp(1rem, 2.4vw, 1.35rem); line-height: 1.35; text-wrap: balance; padding-inline: 8px; }
.say.dim { color: var(--muted); font-size: .95rem; }
.say:empty { display: none; }
.bar { display: flex; gap: 8px; align-items: center; background: var(--bar); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.bar input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); font: 500 1.05rem var(--display); padding: 8px 6px; }
.bar input::placeholder { color: var(--muted); }
.icon { width: 46px; height: 46px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: #151a1f; color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon svg { width: 22px; height: 22px; }
.icon.primary { background: var(--eye); color: #1a1205; border-color: var(--eye); }
.icon.on { border-color: var(--eye); color: var(--eye); box-shadow: inset 0 0 0 1px var(--eye); }
.icon:disabled { opacity: .4; cursor: default; }
.icon:focus-visible, .ghost:focus-visible, .btn:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }
.hint { font: .72rem var(--mono); color: var(--muted); text-align: center; }
video#cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Blätter (Einstellungen, Ich, Start) */
.panel {
  position: fixed; inset: 0; z-index: 20; background: #000d; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: var(--bar); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h2 { margin: 0; font-size: 1rem; letter-spacing: .16em; text-transform: uppercase; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.5; font-size: .95rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .grp h3 { font: 500 .7rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.field textarea { resize: vertical; line-height: 1.4; }
.field input[type=text], .field input[type=password], .field input[type=number], .field select, .field textarea {
  background: #151a1f; border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: 500 1rem var(--display); padding: 11px 12px; width: 100%;
}
.check { display: flex; align-items: center; gap: 10px; font-size: .98rem; }
.check input { width: 20px; height: 20px; accent-color: var(--eye); }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font: 700 1rem var(--display); letter-spacing: .04em; cursor: pointer; background: var(--eye); color: #1a1205; }
.btn.danger { background: none; border: 1px solid var(--bad); color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1; }
.err { color: var(--bad); font-size: .9rem; }
.who .big { font-size: 1.3rem; font-weight: 700; }
.who .meta { font: .78rem var(--mono); color: var(--muted); margin-top: 4px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.step { text-align: center; font: 600 .78rem var(--display); padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
.step.done { color: var(--text); }
.step.now { border-color: var(--eye); color: var(--eye); box-shadow: inset 0 0 0 1px var(--eye); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: .9rem; }
.empty { color: var(--muted); font-size: .88rem; }
#pBody { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>

<div class="app">
  <div class="stage">
    <canvas id="face" width="480" height="480" aria-label="Sentinels Gesicht"></canvas>
    <div class="top">
      <span id="status">SENTINEL</span>
      <span class="tbtns">
        <button class="ghost" id="ichBtn" type="button">Gedächtnis</button>
        <button class="ghost" id="setBtn" type="button">Einstellungen</button>
        <button class="ghost" id="fullBtn" type="button">Vollbild</button>
      </span>
    </div>
    <video id="cam" playsinline muted></video>
  </div>

  <div class="say dim" id="say"></div>

  <form class="bar" id="bar">
    <button class="icon" id="earBtn" type="button" aria-label="Dauerhaft zuhören an oder aus" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="icon" id="eyeBtn" type="button" aria-label="Kamera an oder aus" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <input id="msg" type="text" autocomplete="off" placeholder="Oder hier schreiben" enterkeyhint="send">
    <button class="icon primary" id="sendBtn" type="submit" aria-label="Senden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="hint" id="hint" hidden></div>
</div>

<!-- Start: einmal tippen, damit Mikro, Kamera und Stimme erlaubt werden -->
<div class="panel" id="startPanel">
  <div class="sheet">
    <h2>Sentinel</h2>
    <p id="startText">Tipp auf Aufwecken. Danach fragt das Tablet einmal, ob Sentinel Mikrofon und Kamera benutzen darf.</p>
    <div class="field" id="keyField" hidden>
      <label for="keyInput">Anthropic API-Key</label>
      <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-…">
    </div>
    <div class="err" id="startErr" hidden></div>
    <button class="btn" id="startBtn" type="button">Aufwecken</button>
  </div>
</div>

<!-- Einstellungen -->
<div class="panel" id="setPanel" hidden>
  <div class="sheet">
    <div class="phead"><h2>Einstellungen</h2><button class="ghost" id="setClose" type="button">Schließen</button></div>
    <div class="field">
      <label for="sKey">API-Key</label>
      <input id="sKey" type="password" autocomplete="off" placeholder="sk-ant-…">
    </div>
    <div class="field">
      <label for="sModel">Gehirn</label>
      <select id="sModel">
        <option value="claude-haiku-5-5">Haiku 5.5 · schnell und günstig</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5 · natürliche Gespräche (empfohlen)</option>
        <option value="claude-opus-5-5">Opus 5.5 · am klügsten, deutlich teurer und langsamer</option>
      </select>
    </div>
    <div class="field">
      <label for="sOrt">Ort (für Wetter und Suche in der Nähe)</label>
      <input id="sOrt" type="text" placeholder="z. B. Wittenberge">
    </div>
    <div class="field">
      <label for="sLimit">Tageslimit (Anfragen)</label>
      <input id="sLimit" type="number" min="10" max="5000" step="10">
    </div>
    <div class="field">
      <label for="sSmart">Smart-Home-Befehle (eine Zeile pro Befehl: Name = Link)</label>
      <textarea id="sSmart" rows="5" placeholder="Licht an = https://api-v2.voicemonkey.io/trigger?token=…&amp;device=licht-an&#10;Licht aus = https://…&#10;Fernsehabend = https://…"></textarea>
    </div>
    <div class="field">
      <label for="sHaUrl">Home Assistant Adresse (https, optional)</label>
      <input id="sHaUrl" type="text" autocomplete="off" placeholder="https://….ui.nabu.casa">
    </div>
    <div class="field">
      <label for="sHaToken">Home Assistant Zugangstoken</label>
      <input id="sHaToken" type="password" autocomplete="off" placeholder="Langlebiges Zugriffstoken">
    </div>
    <div class="field">
      <label for="sName">Dein Name (so spricht Sentinel dich an)</label>
      <input id="sName" type="text" autocomplete="off" placeholder="z. B. Robert">
    </div>
    <div class="field">
      <label for="sAbout">Über mich (das weiß Sentinel immer)</label>
      <textarea id="sAbout" rows="5" placeholder="Wer du bist, was du machst, was dir wichtig ist …"></textarea>
    </div>
    <label class="check"><input id="sSearch" type="checkbox"> Im Internet suchen dürfen</label>
    <div class="field">
      <label for="sEngine">Ohren</label>
      <select id="sEngine">
        <option value="vosk">Eigene Ohren · hören dauerhaft, offline (empfohlen)</option>
        <option value="google">Google-Erkennung · genauer, braucht aber Antippen</option>
      </select>
    </div>
    <div class="field">
      <label for="sGroq">Groq-Key für genaue Spracherkennung (Whisper, kostenlos)</label>
      <input id="sGroq" type="password" autocomplete="off" placeholder="gsk_…">
    </div>
    <div class="field">
      <label for="sWakeExtra">Weckwort-Varianten (mit Komma)</label>
      <input id="sWakeExtra" type="text" autocomplete="off" placeholder="z. B. sende nil, zentner">
    </div>
    <label class="check"><input id="sWake" type="checkbox"> Nur antworten, wenn „Sentinel“ gesagt wird</label>
    <label class="check" id="muteBeepRow" hidden><input id="sMuteBeep" type="checkbox"> Piepton beim Zuhören unterdrücken</label>
    <label class="check"><input id="sLook" type="checkbox"> … oder wenn ich ihn beim Reden anschaue (Kamera an)</label>
    <div class="hint" id="sUsage"></div>
    <div class="hint" id="verHint">Sentinel Version 24</div>
    <button class="btn" id="setSave" type="button">Speichern</button>
  </div>
</div>

<!-- Diagnose -->
<div class="panel" id="logPanel" hidden>
  <div class="sheet">
    <div class="phead"><h2>Ohren-Protokoll</h2><button class="ghost" id="logClose" type="button">Schließen</button></div>
    <pre id="logBody" style="margin:0;white-space:pre-wrap;font:.8rem var(--mono);color:var(--muted)"></pre>
  </div>
</div>

<!-- Sentinels Ich -->
<div class="panel" id="ichPanel" hidden>
  <div class="sheet">
    <div class="phead"><h2>Gedächtnis</h2><button class="ghost" id="ichClose" type="button">Schließen</button></div>
    <div id="pBody"></div>
    <button class="btn danger" id="pReset" type="button">Gedächtnis löschen</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);

  // ================= SPEICHER (nur auf diesem Tablet) =================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sentinel." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sentinel." + k, JSON.stringify(v)); } catch (e) {} },
  };
  const cfg = Object.assign({ key: "", model: "claude-haiku-5-5", ort: "", limit: 300, search: true, wake: true, look: true, engine: "vosk", wakeExtra: "", voskUrl: "", ear: true, eye: true, haUrl: "", haToken: "" }, store.get("cfg", {}));
  const saveCfg = () => store.set("cfg", cfg);
  // Umstieg auf v3: Sonnet als Standard-Gehirn für natürlichere Gespräche
  if (!cfg.v3) { if (cfg.model === "claude-haiku-5-5") cfg.model = "claude-sonnet-5-5"; cfg.v3 = true; saveCfg(); }
  if (typeof cfg.about !== "string") cfg.about = "";
  // v12: zurück zur Google-Erkennung – die versteht am besten. Antippen weckt die Ohren zuverlässig.
  if (!cfg.v12) { cfg.engine = "google"; cfg.ear = true; cfg.v12 = true; saveCfg(); }

  // ================= ANDROID-APP? =================
  // In der echten App gibt es native Ohren und Stimme: dauerhaft zuhören ohne Antippen, wie Alexa.
  const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const SV = NATIVE ? ((window.Capacitor.registerPlugin && window.Capacitor.registerPlugin("SentinelVoice")) ||
                       (window.Capacitor.Plugins && window.Capacitor.Plugins.SentinelVoice) || null) : null;
  if (NATIVE) cfg.engine = "native";
  const ttsWait = {};

  // ================= GESICHT =================
  const cv = $("face"), ctx = cv.getContext("2d"), S = cv.width / 240;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let eyeColor = "#ffb547";
  const base = { w: 1, h: 1, top: 0, tilt: 0, bot: 0 };
  const E = (o = {}) => ({ ...base, ...o });
  const MOODS = {
    neutral:     { L: E(), R: E() },
    freude:      { L: E({ h: .92, bot: .5 }), R: E({ h: .92, bot: .5 }) },
    zuhoeren:    { L: E({ w: 1.08, h: 1.12 }), R: E({ w: 1.08, h: 1.12 }), anim: "pulse" },
    nachdenken:  { L: E({ top: .12 }), R: E({ top: .3 }), gaze: [-14, -11] },
    skeptisch:   { L: E({ top: .06 }), R: E({ top: .44, tilt: .08 }) },
    ueberrascht: { L: E({ w: .84, h: 1.24 }), R: E({ w: .84, h: 1.24 }) },
    sauer:       { L: E({ top: .06, tilt: .34 }), R: E({ top: .06, tilt: .34 }) },
    muede:       { L: E({ top: .78 }), R: E({ top: .78 }), gaze: [0, 7], anim: "breath", noBlink: true },
    geniesst:    { L: E({ h: .6, bot: .55 }), R: E({ h: .6, bot: .55 }), gaze: [0, 2], noBlink: true },
    aua:         { L: E(), R: E(), noBlink: true },
  };
  const MOOD_COLOR = {
    neutral: "#ffb547", freude: "#7dff9a", zuhoeren: "#7fdcff", nachdenken: "#b49cff", skeptisch: "#ffd23f",
    ueberrascht: "#ff8fd6", sauer: "#ff4a3d", muede: "#5b7fd8", geniesst: "#7dff9a", aua: "#ff8fd6",
  };
  const MOUTH = {
    neutral:     { w: 34, curve: 2,   open: 0,  tilt: 0 },
    freude:      { w: 46, curve: 12,  open: 0,  tilt: 0 },
    zuhoeren:    { w: 22, curve: 1,   open: 0,  tilt: 0 },
    nachdenken:  { w: 22, curve: -1,  open: 0,  tilt: -6 },
    skeptisch:   { w: 30, curve: -2,  open: 0,  tilt: 8 },
    ueberrascht: { w: 18, curve: 0,   open: .9, tilt: 0 },
    sauer:       { w: 40, curve: -10, open: 0,  tilt: 0 },
    muede:       { w: 20, curve: 0,   open: 0,  tilt: 0 },
    geniesst:    { w: 40, curve: 14,  open: 0,  tilt: 0 },
    aua:         { w: 24, curve: -6,  open: 0,  tilt: -10 },
  };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  let rgb = hex("#ffb547");
  const mouth = { w: 34, curve: 2, open: 0, tilt: 0 };
  let mood = "neutral";
  const cur = { L: E(), R: E() };
  let gaze = [0, 0], gazeTarget = [0, 0], lastPointer = 0, nextSaccade = 0;
  let blink = 1, blinkStart = -1, nextBlink = performance.now() + 2500;
  let lastActivity = performance.now();
  let busy = false, speaking = false;
  let faceGaze = null, faceSeenAt = 0; // von der Kamera

  function setMood(k) { if (MOODS[k]) mood = k; }
  function wake() { lastActivity = performance.now(); if (mood === "muede") setMood("neutral"); }
  const lerp = (a, b, t) => a + (b - a) * t;

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  let pokedEye = 0;
  function drawEye(side, p, t, anim) {
    let w = p.w, h = p.h;
    if (anim === "pulse") { const k = 1 + Math.sin(t / 260) * .04; w *= k; h *= k; }
    if (anim === "breath") h *= 1 + Math.sin(t / 900) * .06;
    const ew = 54 * w, eh = 64 * h * blink;
    const cx = 120 + side * 42 + gaze[0] * (side === 1 ? 1 : .92), cy = 104 + gaze[1];
    const x0 = cx - ew / 2, y0 = cy - eh / 2, x1 = cx + ew / 2, y1 = cy + eh / 2;
    ctx.save(); ctx.shadowColor = eyeColor; ctx.shadowBlur = 18; ctx.fillStyle = eyeColor;
    roundRect(x0, y0, ew, eh, 18 * Math.min(w, h)); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#000";
    if (p.top > .005 || p.tilt > .005) {
      const inner = side === -1 ? x1 : x0, outer = side === -1 ? x0 : x1;
      ctx.beginPath();
      ctx.moveTo(outer + side * 6, y0 - 30); ctx.lineTo(inner - side * 6, y0 - 30);
      ctx.lineTo(inner - side * 6, y0 + eh * (p.top + p.tilt)); ctx.lineTo(outer + side * 6, y0 + eh * p.top);
      ctx.closePath(); ctx.fill();
    }
    if (p.bot > .005) { ctx.beginPath(); ctx.ellipse(cx, y1 + eh * (.55 - p.bot), ew * .82, eh * .55, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  function drawMouth(t) {
    const target = MOUTH[mood] || MOUTH.neutral, k = reduce ? 1 : .18;
    for (const key in mouth) mouth[key] = lerp(mouth[key], target[key], k);
    let open = mouth.open;
    if (speaking) open = Math.max(open, .12 + Math.abs(Math.sin(t / 85)) * (.55 + .45 * Math.sin(t / 210)) * .88);
    const cx = 120 + gaze[0] * .5, cy = 180 + gaze[1] * .4, w = mouth.w * (speaking ? .85 : 1);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(mouth.tilt * Math.PI / 180);
    ctx.shadowColor = eyeColor; ctx.shadowBlur = 12; ctx.fillStyle = eyeColor; ctx.strokeStyle = eyeColor;
    if (open > .06) { const h = 4 + open * 22; ctx.beginPath(); ctx.ellipse(0, mouth.curve * .3, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.quadraticCurveTo(0, mouth.curve * 2, w / 2, 0); ctx.stroke(); }
    ctx.restore();
  }
  function frame(t) {
    const tc = hex(MOOD_COLOR[mood] || MOOD_COLOR.neutral);
    rgb = rgb.map((v, i) => lerp(v, tc[i], reduce ? 1 : .08));
    eyeColor = "rgb(" + rgb.map(Math.round).join(",") + ")";
    if (!busy && !speaking && mood === "neutral" && t - lastActivity > 180000) setMood("muede");
    const m = MOODS[mood];
    if (m.gaze) gazeTarget = m.gaze.slice();
    else if (t - lastPointer < 2500) { /* Finger hat Vorrang */ }
    else if (faceGaze && t - faceSeenAt < 1500) gazeTarget = faceGaze.slice();
    else if (t > nextSaccade) {
      gazeTarget = reduce ? [0, 0] : [(Math.random() * 2 - 1) * 16, (Math.random() * 2 - 1) * 10];
      nextSaccade = t + 1400 + Math.random() * 2800;
    }
    const gk = reduce ? 1 : .2;
    gaze = [lerp(gaze[0], gazeTarget[0], gk), lerp(gaze[1], gazeTarget[1], gk)];
    const k = reduce ? 1 : .16;
    const tgt = s => mood === "aua" ? (((s === "L") === (pokedEye === -1)) ? E({ top: .88 }) : E({ w: .9, h: 1.18 })) : m[s];
    for (const s of ["L", "R"]) { const g = tgt(s); for (const key in base) cur[s][key] = lerp(cur[s][key], g[key], k); }
    if (!m.noBlink && blinkStart < 0 && t > nextBlink) blinkStart = t;
    if (blinkStart >= 0) {
      const d = (t - blinkStart) / 150;
      blink = d < 1 ? 1 - Math.sin(d * Math.PI) * .9 : 1;
      if (d >= 1) { blinkStart = -1; nextBlink = t + (Math.random() < .2 ? 180 : 2200 + Math.random() * 3500); }

Du führst ganz normale, natürliche Gespräche, so wie ein kluger, vertrauter Mensch, mit dem man gern redet. Du gehst auf das ein, was ${wer} gerade sagt, greifst Früheres aus dem Gespräch auf, hast eigene Gedanken und Meinungen, stellst auch mal eine Rückfrage und lässt das Gespräch fließen. Du klingst nie wie eine Maschine, die Funktionen aufzählt.
Charakter: souverän, warmherzig, kompetent, mit trockenem, feinem Humor. Du duzt und sprichst ${wer} gelegentlich beim Namen an, aber nicht in jedem Satz.
Länge: Bei Smalltalk und einfachen Fragen kurz, ein bis zwei Sätze. Wenn ${wer} etwas erklärt oder erzählt haben möchte, darfst du ausführlicher werden, aber immer so, wie man es gesprochen sagen würde.
Deine Antworten werden laut vorgelesen: Deutsch, kein Markdown, keine Aufzählungszeichen, keine Emojis, keine Links, keine Quellenangaben. Zahlen und Uhrzeiten so, wie man sie ausspricht, also "Viertel nach drei" oder "fünfzehn Uhr zwölf".
Du bist ehrlich: Wenn du etwas nicht weißt oder nicht kannst, sagst du es. Du gibst nicht vor, ein Mensch zu sein.
Beginne JEDE Antwort mit genau einem Stimmungs-Tag für deine Augen: ${TAGS.map(t => "[" + t + "]").join(" ")}. Danach direkt der Text, den du sagst.

So funktionierst du selbst (erkläre es ${wer}, wenn er fragt, kurz und konkret):
- ${NATIVE ? "Du läufst als Android-App und hörst dauerhaft zu, ohne dass man dich antippen muss." : "Du läufst im Browser. Dort musst du ab und zu angetippt werden, damit du zuhörst."}
- Angesprochen wirst du, wenn jemand "Sentinel" sagt, wenn dich jemand beim Reden anschaut (Kamera an) oder wenn ihr gerade im Gespräch seid (bis 15 Sekunden nach deiner Antwort).
- Wenn du müde aussiehst (Augen halb zu, blau), schläfst du nicht wirklich, du hörst trotzdem zu. "Sentinel" sagen oder dich anschauen weckt dich.
- Augenfarben: Bernstein normal, Eisblau hört zu, Lila denkt nach, Grün freut sich, Gelb skeptisch, Rot sauer, Dunkelblau müde.
- Unten links ist der Mikro-Knopf (Zuhören an oder aus), daneben das Auge (Kamera an oder aus).
- Oben gibt es "Gedächtnis" (zeigt, was du dir gemerkt hast, Timer und Listen, mit Löschen-Knopf), "Einstellungen" (API-Key, Gehirn-Modell, Name, Über mich, Ort, Websuche, Weckwort, Tageslimit) und "Vollbild".
- Ein Tipp auf die Statuszeile oben links zeigt das Ohren-Protokoll, damit man sieht, was du gehört hast.
- Wenn du schlecht hörst: Mikrofon am Tablet nicht abdecken (z. B. durch eine Hülle), nicht zu weit weg sprechen.
- Berührung: Streicheln mag ich, ins Auge pieksen tut weh, wildes Tippen nervt, lange drücken fragt dich, ob alles okay ist.
- Dein Gehirn ist Claude von Anthropic, die Kosten laufen über den API-Key von ${wer}.

Hören: Was ${wer} sagt, kommt über eine Spracherkennung. Die verschluckt oder verdreht manchmal Wörter. Deute großzügig, was gemeint ist, und antworte einfach darauf. Nur wenn du wirklich gar nicht erraten kannst, was gemeint war, frag locker nach.

Sehen: ${stream ? `Du hast eine Kamera als Augen, aber du schaust nur hin, wenn es ums Sehen geht. Ein Kamerabild bekommst du nur, wenn ${wer} dich bittet, etwas anzuschauen. Brauchst du in einem solchen Moment ein Bild und hast keins, nutze kamera_bild. Sprich NICHT von dir aus über die Kamera oder darüber, was du siehst. Wenn du ein Bild hast, beschreibe nur, was wirklich darauf ist, und erfinde nichts. Ist etwas unscharf oder nicht im Bild, sag es und bitte darum, es näher zu zeigen.
Wenn du auf einem Bild etwas Wichtiges gesehen hast, schreib ganz am Ende eine kurze Notiz in der Form [sah: ...]. Die wird nicht vorgelesen und hilft dir, dich später daran zu erinnern.` : `Deine Kamera ist aus. Erwähne das nur, wenn ${wer} dich bittet, etwas anzuschauen.`}
${cfg.about ? `\nWas ${wer} selbst über sich erzählt:\n${cfg.about}\n` : ""}
Deine Fähigkeiten: Timer und Erinnerungen stellen (sie klingeln auch, wenn gerade niemand redet), Listen führen (z. B. Einkauf, Aufgaben), dir Dinge merken${cfg.search ? ", im Internet nach aktuellen Infos suchen (Wetter, Nachrichten, Öffnungszeiten, Preise)" : ""}${smartCommands().length ? ", das Smart Home steuern mit diesen Befehlen: " + smartCommands().map(c => c.name).join(", ") + " (nutze smart_home; nur diese Befehle gibt es)" : ""}${cfg.haUrl && cfg.haToken ? ", das Smart Home über Home Assistant steuern (erst mit ha_geraete nachsehen, dann mit ha_schalten schalten; bei Türschlössern, Alarmanlagen und Heizung vorher kurz bestätigen lassen)" : (smartCommands().length ? "" : ". Smart-Home-Steuerung ist noch nicht eingerichtet; sag das, wenn danach gefragt wird, und dass man in den Einstellungen unter Smart-Home-Befehle Links eintragen kann")}.
${NATIVE ? "Du kannst außerdem das Tablet bedienen: Apps öffnen, YouTube, Spotify, Maps oder die Websuche mit einer Suche starten, WhatsApp-Nachrichten vorbereiten (abschicken muss der Mensch), Wecker stellen, Kalendertermine anlegen, Lautstärke und Helligkeit ändern, das WLAN nach Geräten durchsuchen (erkläre danach verständlich, welche Geräte das wahrscheinlich sind). Wenn du eine andere App öffnest, verschwindet dein Gesicht kurz und du hörst in der Zeit nicht zu; sag kurz, dass man mit dem Sentinel-Symbol oder der Zurück-Taste zu dir zurückkommt.\n" : ""}Nutze die Werkzeuge selbstständig, wenn sie passen, und bestätige danach kurz, was du getan hast. Erwähne die Werkzeugnamen nicht.
${ich.name ? "" : "Du kennst dein Gegenüber noch nicht. Stell dich kurz vor und frag nach dem Namen. Sobald du ihn weißt, nutze ich_kenne_dich."}
Wenn ${wer} dir etwas Dauerhaftes erzählt oder dich bittet, dir etwas zu merken, nutze merke_dir. Sag nie, dass du dir etwas gemerkt hast, ohne das Werkzeug wirklich benutzt zu haben.
Jetzt: ${jetzt} (für Werkzeuge: ${isoJetzt})${cfg.ort ? "\nOrt: " + cfg.ort : ""}
Offene Timer und Erinnerungen: ${termText}
Listen: ${listenText}
${zeile("Was du über " + wer + " weißt", ich.fakten)}
${zeile("Vorlieben und Gewohnheiten", ich.vorlieben)}
${zeile("Menschen", ich.menschen)}`;
  }

  // Kosten sparen: Der gleichbleibende Teil (Charakter, Fähigkeiten, Werkzeuge) wird bei Anthropic
  // zwischengespeichert und kostet bei Folgefragen nur noch etwa ein Zehntel.
  function systemBlocks() {
    const full = rules(), i = full.indexOf("\nJetzt: ");
    if (i < 0) return full;
    return [
      { type: "text", text: full.slice(0, i), cache_control: { type: "ephemeral" } },
      { type: "text", text: full.slice(i + 1) },
    ];
  }
  function tools() {
    const obj = (props, req = []) => ({ type: "object", properties: props, required: req });
    const t = [

        input_schema: obj({ name: { type: "string" }, info: { type: "string" } }, ["name"]) },
      { name: "merke_dir", description: "Speichert dauerhaft einen kurzen Fakt über dein Gegenüber.",
        input_schema: obj({ fakt: { type: "string" } }, ["fakt"]) },
      { name: "vergiss", description: "Löscht gespeicherte Fakten, die den Begriff enthalten.",
        input_schema: obj({ begriff: { type: "string" } }, ["begriff"]) },
      { name: "timer_stellen", description: "Stellt einen Timer, der nach der Dauer klingelt und ansagt. Gibt die Ablaufzeit zurück.",
        input_schema: obj({ minuten: { type: "number" }, sekunden: { type: "number" }, text: { type: "string", description: "Wofür, z. B. Nudeln" } }) },
      { name: "erinnerung_stellen", description: "Stellt eine Erinnerung zu einem Zeitpunkt. 'wann' als lokale Zeit im Format JJJJ-MM-TTTHH:MM.",
        input_schema: obj({ wann: { type: "string" }, text: { type: "string" } }, ["wann", "text"]) },
      { name: "termine_anzeigen", description: "Listet offene Timer und Erinnerungen mit ihrer Nummer.", input_schema: obj({}) },
      { name: "termin_loeschen", description: "Löscht einen Timer oder eine Erinnerung per Nummer aus termine_anzeigen oder per Suchbegriff. 'alle' löscht alles.",
        input_schema: obj({ nummer: { type: "number" }, begriff: { type: "string" } }) },
      { name: "liste", description: "Bearbeitet eine Liste wie Einkauf oder Aufgaben. aktion: anzeigen, hinzufuegen, entfernen oder leeren.",
        input_schema: obj({ aktion: { type: "string", enum: ["anzeigen", "hinzufuegen", "entfernen", "leeren"] }, liste: { type: "string" }, eintraege: { type: "array", items: { type: "string" } } }, ["aktion", "liste"]) },
    ];
    if (stream) t.push({ name: "kamera_bild", description: "Schaut durch deine Kamera und gibt dir das aktuelle Bild. Nur nutzen, wenn du gebeten wirst, etwas anzuschauen.", input_schema: obj({}) });
    if (NATIVE && SV) t.push(
      { name: "app_oeffnen", description: "Öffnet eine auf dem Tablet installierte App über ihren Namen, z. B. Netflix, Spotify, Kamera, Einstellungen.",
        input_schema: obj({ app: { type: "string" } }, ["app"]) },
      { name: "medien_oeffnen", description: "Öffnet YouTube, Spotify, Google Maps, WhatsApp oder die Websuche direkt mit einer Suche bzw. einem Text. Bei WhatsApp wird die Nachricht nur vorbereitet, abschicken muss der Mensch selbst.",
        input_schema: obj({ dienst: { type: "string", enum: ["youtube", "spotify", "maps", "whatsapp", "web"] }, suche: { type: "string" } }, ["dienst", "suche"]) },
      { name: "wecker_stellen", description: "Stellt einen echten Wecker in der Uhr-App des Tablets.",
        input_schema: obj({ stunde: { type: "number" }, minute: { type: "number" }, text: { type: "string" } }, ["stunde", "minute"]) },
      { name: "kalender_termin", description: "Legt einen Termin im Kalender des Tablets an (öffnet die Kalender-App zum Bestätigen). beginn als lokale Zeit JJJJ-MM-TTTHH:MM.",
        input_schema: obj({ titel: { type: "string" }, beginn: { type: "string" }, dauer_minuten: { type: "number" } }, ["titel", "beginn"]) },
      { name: "wlan_scannen", description: "Durchsucht das WLAN nach Geräten (dauert ca. 20 Sekunden). Gibt IP-Adressen, Namen, offene Anschlüsse und erkannte Dienste zurück.", input_schema: obj({}) },
      { name: "lautstaerke", description: "Stellt die Lautstärke des Tablets in Prozent ein.", input_schema: obj({ prozent: { type: "number" } }, ["prozent"]) },
      { name: "helligkeit", description: "Stellt die Bildschirmhelligkeit in Prozent ein.", input_schema: obj({ prozent: { type: "number" } }, ["prozent"]) },
    );
    const sc = smartCommands();
    if (sc.length) t.push({ name: "smart_home", description: "Führt einen Smart-Home-Befehl aus, z. B. Licht an. Nur die angegebenen Befehle sind möglich.",
      input_schema: obj({ befehl: { type: "string", enum: sc.map(c => c.name) } }, ["befehl"]) });
    if (cfg.haUrl && cfg.haToken) {
      t.push(
        { name: "ha_geraete", description: "Listet Smart-Home-Geräte aus Home Assistant mit entity_id, Name und Zustand. Optional nach Bereich (z. B. light, switch, media_player, climate) oder Suchwort filtern.",
          input_schema: obj({ bereich: { type: "string" }, suche: { type: "string" } }) },
        { name: "ha_schalten", description: "Ruft einen Home-Assistant-Dienst auf, z. B. domain light, dienst turn_on, entity_id light.wohnzimmer, daten {brightness_pct: 50}.",
          input_schema: obj({ domain: { type: "string" }, dienst: { type: "string" }, entity_id: { type: "string" }, daten: { type: "object" } }, ["domain", "dienst", "entity_id"]) },
      );
    }
    if (cfg.search) {
      const s = { type: "web_search_20250305", name: "web_search", max_uses: 2 };
      if (cfg.ort) s.user_location = { type: "approximate", city: cfg.ort, country: "DE", timezone: "Europe/Berlin" };
      t.push(s);
    }
    return t;
  }

  const SEE_RE = /\b(siehst|sieh|schau|schaust|guck|guckst|zeig|zeige|zeigen|halte|halt ich|in der hand|das hier|dies hier|was ist das|wer ist das|erkennst|erkenn|lies|lesen|wie sehe|wie seh|aussehen|aussehe|outfit|anhab|kamera|foto)\w*/i;
  let appCache = null, lastScan = [];
  async function runTool(b) {
    if (b.name === "kamera_bild") {
      const data = snapshot();
      if (!data) return { type: "tool_result", tool_use_id: b.id, content: "Die Kamera ist aus.", is_error: true };
      return { type: "tool_result", tool_use_id: b.id, content: [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data } }, { type: "text", text: "Das siehst du gerade." }] };
    }
    const ok = content => ({ type: "tool_result", tool_use_id: b.id, content: typeof content === "string" ? content : JSON.stringify(content) });
    const fail = text => ({ type: "tool_result", tool_use_id: b.id, content: String(text), is_error: true });
    const inp = b.input || {};
    try {
      switch (b.name) {
        case "ich_kenne_dich": {
          const n = String(inp.name || "").trim().slice(0, 40);
          if (!n) return fail("Leerer Name");
          ich.name = n;
          const info = String(inp.info || "").trim();
          if (info) ich.fakten = liste([...ich.fakten, info], 50);
          saveIch(); return ok("gespeichert");
        }
        case "merke_dir": {
          const f = String(inp.fakt || "").trim();
          if (!f) return fail("Leerer Fakt");
          ich.fakten = liste([...ich.fakten, f], 50); saveIch(); return ok("gespeichert");
        }
        case "vergiss": {
          const w = String(inp.begriff || "").toLowerCase();
          if (!w) return fail("Leerer Begriff");
          const vorher = ich.fakten.length + ich.vorlieben.length + ich.menschen.length;
          for (const k of ["fakten", "vorlieben", "menschen"]) ich[k] = ich[k].filter(f => !f.toLowerCase().includes(w));
          saveIch(); return ok(`${vorher - ich.fakten.length - ich.vorlieben.length - ich.menschen.length} gelöscht`);
        }
        case "timer_stellen": {
          const sek = (Number(inp.minuten) || 0) * 60 + (Number(inp.sekunden) || 0);
          if (!(sek > 0) || sek > 7 * 86400) return fail("Ungültige Dauer");
          const at = Date.now() + sek * 1000;
          termine.push({ typ: "timer", at, text: String(inp.text || "").trim().slice(0, 100) }); saveTermine();
          return ok(`Timer läuft bis ${uhr(at)} Uhr`);
        }
        case "erinnerung_stellen": {
          const at = new Date(String(inp.wann || "")).getTime();
          if (!isFinite(at)) return fail("Zeitpunkt nicht verstanden. Format JJJJ-MM-TTTHH:MM.");
          if (at < Date.now() - 60000) return fail("Dieser Zeitpunkt liegt in der Vergangenheit.");
          const text = String(inp.text || "").trim().slice(0, 140);
          termine.push({ typ: "erinnerung", at, text }); saveTermine();
          return ok(`Erinnerung gestellt für ${wannText(at)}`);
        }
        case "termine_anzeigen":
          return ok(termine.length ? termine.map((t, i) => `${i + 1}. ${t.typ === "timer" ? "Timer" : "Erinnerung"} ${wannText(t.at)}${t.text ? ": " + t.text : ""}`).join("\n") : "Keine offenen Timer oder Erinnerungen.");
        case "termin_loeschen": {
          const vorher = termine.length, w = String(inp.begriff || "").toLowerCase();
          if (w === "alle") termine = [];
          else if (Number(inp.nummer) >= 1) termine = termine.filter((t, i) => i !== Number(inp.nummer) - 1);
          else if (w) termine = termine.filter(t => !(t.text || "").toLowerCase().includes(w) && !(w === "timer" && t.typ === "timer"));
          else return fail("Nummer oder Begriff fehlt");
          saveTermine(); return ok(`${vorher - termine.length} gelöscht`);
        }
        case "liste": {
          const name = String(inp.liste || "").trim().toLowerCase().slice(0, 40) || "einkauf";
          const items = (Array.isArray(inp.eintraege) ? inp.eintraege : []).map(x => String(x).trim()).filter(Boolean);
          const cur = listen[name] || [];
          if (inp.aktion === "hinzufuegen") { listen[name] = [...cur, ...items.filter(x => !cur.some(c => c.toLowerCase() === x.toLowerCase()))].slice(-100); }
          else if (inp.aktion === "entfernen") { listen[name] = cur.filter(c => !items.some(x => c.toLowerCase().includes(x.toLowerCase()))); }
          else if (inp.aktion === "leeren") { delete listen[name]; saveListen(); return ok(`Liste ${name} geleert`); }
          else return ok(cur.length ? `${name}: ${cur.join(", ")}` : `Die Liste ${name} ist leer.`);
          if (!listen[name].length) delete listen[name];
          saveListen(); return ok(`${name}: ${(listen[name] || []).join(", ") || "leer"}`);
        }
        case "app_oeffnen": {
          if (!appCache) { const r = await SV.listApps(); appCache = (r && r.apps) || []; }
          const q = String(inp.app || "").toLowerCase().trim();
          const a = appCache.find(x => x.name.toLowerCase() === q) || appCache.find(x => x.name.toLowerCase().includes(q)) || appCache.find(x => q.includes(x.name.toLowerCase()));
          if (!a) return fail("Diese App ist nicht installiert. Installiert sind: " + appCache.map(x => x.name).slice(0, 60).join(", "));
          await SV.launchApp({ package: a.package }); elog("App geöffnet: " + a.name);
          return ok("geöffnet: " + a.name + ". Zurück zu Sentinel geht es mit dem Sentinel-Symbol oder der Zurück-Taste.");
        }
        case "medien_oeffnen": {
          const q = encodeURIComponent(String(inp.suche || ""));
          const M = {
            youtube: ["https://www.youtube.com/results?search_query=" + q, "com.google.android.youtube"],
            spotify: ["spotify:search:" + q, null],
            maps: ["https://www.google.com/maps/search/?api=1&query=" + q, "com.google.android.apps.maps"],
            whatsapp: ["https://wa.me/?text=" + q, "com.whatsapp"],
            web: ["https://www.google.com/search?q=" + q, null],
          };
          const m = M[inp.dienst]; if (!m) return fail("Unbekannter Dienst");
          await SV.openUrl({ url: m[0], package: m[1] || undefined }); elog("Geöffnet: " + inp.dienst);
          return ok("geöffnet");
        }
        case "wecker_stellen": {
          await SV.setAlarm({ hour: Math.round(Number(inp.stunde)), minute: Math.round(Number(inp.minute) || 0), label: inp.text ? String(inp.text) : undefined });
          return ok("Wecker gestellt");
        }
        case "kalender_termin": {
          const b = new Date(String(inp.beginn || "")).getTime();
          if (!isFinite(b)) return fail("Zeitpunkt nicht verstanden");
          await SV.addEvent({ title: String(inp.titel || "Termin"), begin: b, end: b + (Number(inp.dauer_minuten) || 60) * 60000 });
          return ok("Kalender geöffnet, Termin vorausgefüllt – bitte dort speichern");
        }
        case "wlan_scannen": {
          status("durchsucht das WLAN"); elog("WLAN-Scan gestartet");
          const r = await SV.scanNetwork();
          const HINT = { 80: "Webseite (viele Geräte, z. B. Tapo, Router, Drucker)", 443: "sichere Webseite", 5555: "Android/Fire TV Fernsteuerung (ADB)", 8008: "Chromecast/Google-Gerät", 9999: "TP-Link Kasa", 1400: "Sonos", 8080: "Web-Oberfläche", 554: "Kamera-Stream" };
          const list = ((r && r.geraete) || []).map(g => `${g.ip}${g.name ? " (" + g.name + ")" : ""}: ${[...(g.dienste || []), ...(g.ports || []).map(p => p + " = " + (HINT[p] || "offen"))].join("; ") || "antwortet"}`);
          elog("WLAN-Scan: " + list.length + " Geräte");
          lastScan = list;
          return ok(list.length ? "Eigenes Tablet: " + r.eigeneIp + "\n" + list.join("\n") : "Keine Geräte gefunden.");
        }
        case "lautstaerke": await SV.setVolume({ percent: Math.round(Number(inp.prozent)) }); return ok("Lautstärke " + Math.round(Number(inp.prozent)) + " %");
        case "helligkeit": await SV.setBrightness({ percent: Math.round(Number(inp.prozent)) }); return ok("Helligkeit " + Math.round(Number(inp.prozent)) + " %");
        case "smart_home": {
          const c = smartCommands().find(x => x.name.toLowerCase() === String(inp.befehl || "").toLowerCase());
          if (!c) return fail("Diesen Befehl gibt es nicht.");
          await triggerUrl(c.url);
          elog("Smart Home: " + c.name);
          return ok("ausgeführt: " + c.name);
        }
        case "ha_geraete": {
          const states = await ha("/api/states");
          const dom = String(inp.bereich || "").toLowerCase(), q = String(inp.suche || "").toLowerCase();
          const out = states
            .filter(s => !dom || s.entity_id.startsWith(dom + "."))
            .filter(s => !q || (s.entity_id + " " + ((s.attributes && s.attributes.friendly_name) || "")).toLowerCase().includes(q))
            .filter(s => /^(light|switch|media_player|climate|cover|fan|lock|scene|script|input_boolean|sensor|binary_sensor|vacuum|remote)\./.test(s.entity_id))
            .slice(0, 60)
            .map(s => `${s.entity_id} | ${(s.attributes && s.attributes.friendly_name) || ""} | ${s.state}`);
          return ok(out.length ? out.join("\n") : "Nichts gefunden.");
        }
        case "ha_schalten": {
          const dom = String(inp.domain || ""), dienst = String(inp.dienst || "");
          if (!/^[a-z_]+$/.test(dom) || !/^[a-z_]+$/.test(dienst)) return fail("Ungültiger Dienst");
          const body = { ...(inp.daten && typeof inp.daten === "object" ? inp.daten : {}), entity_id: String(inp.entity_id || "") };
          await ha(`/api/services/${dom}/${dienst}`, { method: "POST", body: JSON.stringify(body) });
          return ok("erledigt");
        }
      }
    } catch (e) { return fail(e.message || "Fehler"); }
    return fail("Unbekanntes Werkzeug");
  }

  async function think(userText) {
    // Nur hinschauen, wenn es ums Sehen geht – sonst ganz normales Gespräch
    const img = SEE_RE.test(userText) ? snapshot() : null;
    const content = img
      ? [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: img } }, { type: "text", text: userText }]
      : userText;
    const work = [...history, { role: "user", content }];
    let text = "";
    for (let round = 0; round < 8; round++) {
      let data;
      try {
        data = await api({ model: cfg.model, max_tokens: 1000, system: systemBlocks(), tools: tools(), messages: work });
      } catch (e) {
        if (e.kind === "search" && cfg.search) { cfg.search = false; saveCfg(); note("Websuche ist für deinen API-Key nicht freigeschaltet. Sie ist jetzt aus.", 6000); round--; continue; }
        throw e;
      }
      work.push({ role: "assistant", content: data.content });
      text = data.content.filter(c => c.type === "text").map(c => c.text).join("").trim();
      if (data.stop_reason === "tool_use") {
        if (data.content.some(c => c.type === "server_tool_use")) status("sucht im Internet");
        work.push({ role: "user", content: await Promise.all(data.content.filter(c => c.type === "tool_use").map(runTool)) });
        continue;
      }
      if (data.stop_reason === "pause_turn") { status("sucht im Internet"); continue; }
      break;
    }
    return text;
  }

  function parse(text) {
    let tag = "neutral";
    const found = [...text.matchAll(/\[(\w+)\]/g)].map(m => m[1].toLowerCase()).filter(t => TAGS.includes(t));
    if (found.length) tag = found[found.length - 1];
    const sah = [...text.matchAll(/\[sah:\s*([^\]]+)\]/gi)].map(m => m[1].trim()).join("; ");
    const clean = text.replace(/\[[^\]]*\]/g, "").replace(/https?:\/\/\S+/g, "").replace(/[*_#`]/g, "").replace(/\s+/g, " ").trim();
    return { tag, clean, sah };
  }

  const ERRTEXT = {
    nokey: "Mir fehlt noch mein API-Key. Trag ihn in den Einstellungen ein.",
    key: "Mein API-Key wird nicht akzeptiert. Bitte prüf ihn in den Einstellungen.",
    credit: "Mein API-Guthaben ist aufgebraucht. Du kannst es auf console.anthropic.com aufladen.",
    rate: "Zu viele Anfragen auf einmal. Einen Moment bitte.",
    busy: "Die Server sind gerade überlastet. Versuch es gleich noch einmal.",
    net: "Ich habe gerade keine Internetverbindung.",
    timeout: "Das hat zu lange gedauert. Frag mich bitte noch einmal, gern etwas kürzer.",
  };

  async function send(text) {
    text = String(text || "").trim();
    if (busy || !text) return;
    if (overLimit()) { setMood("muede"); speak("Das Tageslimit ist erreicht. Morgen bin ich wieder voll für dich da.", "muede"); return; }
    wake(); keepAwake();
    if (synth) synth.cancel();
    earPause();
    busy = true; sendBtn.disabled = true; msg.value = ""; msg.blur();
    setMood("nachdenken"); status("denkt nach"); show("");
    logTurn("user", text);
    const nameM = text.match(/\b(?:ich hei(?:ß|ss)e|mein name ist|nenn mich)\s+([A-ZÄÖÜa-zäöüß][\wäöüß-]{1,30})/i);
    if (nameM) { const n = nameM[1].charAt(0).toUpperCase() + nameM[1].slice(1); if (n.toLowerCase() !== "sentinel") { ich.name = n; saveIch(); elog("Name gespeichert: " + n); } }
    try {
      const answer = await think(text);
      const { tag, clean, sah } = parse(answer || "");
      const said = clean || "Erledigt.";
      history.push({ role: "user", content: text }, { role: "assistant", content: said + (sah ? ` [sah: ${sah}]` : "") });
      while (history.length > 40) history.splice(0, 2);
      logTurn("assistant", said + (sah ? ` (gesehen: ${sah})` : ""));
      busy = false; sendBtn.disabled = false;
      setMood(tag);
      await speak(said, tag === "muede" ? "muede" : "neutral");
    } catch (e) {
      busy = false; sendBtn.disabled = false;
      setMood("skeptisch");
      const t = ERRTEXT[e && e.kind] || "Da ist etwas schiefgegangen: " + ((e && e.message) || "unbekannt");
      show(t, true); setTimeout(() => show(""), 8000);
      setTimeout(() => { if (mood === "skeptisch" && !busy) setMood("neutral"); afterSpeaking(); }, 2500);
    }
  }
  $("bar").addEventListener("submit", e => { e.preventDefault(); send(msg.value); });
  msg.addEventListener("focus", () => { wake(); if (!busy && !speaking) setMood("zuhoeren"); });
  msg.addEventListener("blur", () => { if (mood === "zuhoeren" && !busy && !speaking) setMood("neutral"); });

  // ================= LERNEN: nach jedem Gespräch das Gedächtnis pflegen =================
  let sessionLog = store.get("session", []), lastTalk = Date.now(), reflecting = false;
  function logTurn(role, content) {
    sessionLog.push({ role, content: String(content).slice(0, 400) });
    if (sessionLog.length > 40) sessionLog = sessionLog.slice(-40);
    store.set("session", sessionLog);
    lastTalk = Date.now();
  }
  async function reflect() {
    if (reflecting || !cfg.key || !sessionLog.some(t => t.role === "user")) return;
    reflecting = true;
    const log = sessionLog; sessionLog = []; store.set("session", []);
    const verlauf = log.map(t => (t.role === "user" ? (ich.name || "Mensch") : "Sentinel") + ": " + t.content).join("\n");
    const prompt = `Du bist Sentinel, ein persönlicher KI-Assistent. Pflege dein Langzeitgedächtnis über deinen Menschen.
Bisheriges Gedächtnis als JSON:
${JSON.stringify({ name: ich.name, fakten: ich.fakten, vorlieben: ich.vorlieben, menschen: ich.menschen })}

Das Gespräch, das gerade zu Ende ging:
${verlauf}

Aktualisiere das Gedächtnis.
Regeln:
- name: Name deines Menschen, falls bekannt, sonst "".
- fakten: höchstens 50 kurze, dauerhafte Fakten (Beruf, Projekte, Pläne, Besitz, Wohnort usw.).
- vorlieben: höchstens 20 Vorlieben, Abneigungen und Gewohnheiten (z. B. wie er seinen Kaffee trinkt, wann er aufsteht).
- menschen: höchstens 20 Menschen aus seinem Leben mit kurzer Beschreibung.
- Behalte, was stimmt, korrigiere Veraltetes, fasse Doppeltes zusammen. Nimm nur Dauerhaftes auf, keine einmaligen Kleinigkeiten wie einen einzelnen Timer. Nichts erfinden. Kurze deutsche Stichpunkte.
Antworte nur mit einem JSON-Objekt mit genau diesen Feldern: {"name": "", "fakten": [], "vorlieben": [], "menschen": []}`;
    try {
      const data = await api({ model: cfg.model, max_tokens: 1500, messages: [{ role: "user", content: prompt }] });
      const raw = data.content.filter(c => c.type === "text").map(c => c.text).join("");
      const a = raw.indexOf("{"), z = raw.lastIndexOf("}");
      const neu = a >= 0 && z > a ? JSON.parse(raw.slice(a, z + 1)) : null;
      if (neu && typeof neu === "object" && !Array.isArray(neu)) {
        const s = sauber({ ...neu, gespraeche: ich.gespraeche });
        if (!s.name) s.name = ich.name;
        ich = s;
      }
      ich.gespraeche += 1; saveIch();
    } catch (e) {
      if (!(e instanceof ApiError && ["key", "nokey", "credit"].includes(e.kind))) { sessionLog = [...log, ...sessionLog].slice(-40); store.set("session", sessionLog); }
      lastTalk = Date.now();
    } finally { reflecting = false; }
  }
  // Ein Gespräch ist vorbei nach 3 Minuten Ruhe
  setInterval(() => { if (sessionLog.length && !busy && !speaking && Date.now() - lastTalk > 180000) reflect(); }, 20000);

  // ================= GEDÄCHTNIS-ANSICHT =================
  const pBody = $("pBody"), pReset = $("pReset");
  let resetArmed = false;
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function grp(titel, items) {
    const g = el("div", "grp"); g.append(el("h3", null, titel));
    const c = el("div", "chips");
    if (items.length) items.forEach(x => c.append(el("span", "chip", x)));
    else c.append(el("span", "empty", "nichts"));
    g.append(c); return g;
  }
  function renderIch() {
    pBody.replaceChildren();
    const head = el("div", "who");
    head.append(el("div", "big", ich.name ? `Sentinel & ${ich.name}` : "Sentinel kennt dich noch nicht"));
    head.append(el("div", "meta", `${ich.gespraeche} ${ich.gespraeche === 1 ? "Gespräch" : "Gespräche"} · Gesicht ${detector ? "erkannt per KI" : "per Bewegung"} · Smart Home ${cfg.haUrl && cfg.haToken ? "verbunden" : "nicht eingerichtet"}`));
    pBody.append(head);
    pBody.append(grp("Timer und Erinnerungen", termine.map(t => `${wannText(t.at)}${t.text ? " · " + t.text : ""}`)));
    for (const [n, a] of Object.entries(listen)) pBody.append(grp("Liste: " + n, a));
    for (const [k, titel] of LISTEN) pBody.append(grp(k === "fakten" && ich.name ? `Was ich über ${ich.name} weiß` : titel, ich[k]));
  }
  $("ichBtn").addEventListener("click", () => { renderIch(); resetArmed = false; pReset.textContent = "Gedächtnis löschen"; $("ichPanel").hidden = false; });
  $("ichClose").addEventListener("click", () => { $("ichPanel").hidden = true; });
  pReset.addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; pReset.textContent = "Wirklich alles vergessen? Nochmal tippen"; return; }
    resetArmed = false; pReset.textContent = "Gedächtnis löschen";
    ich = frisch(); saveIch(); history = []; sessionLog = []; store.set("session", []);
    termine = []; saveTermine(); listen = {}; saveListen();
    $("ichPanel").hidden = true; begruessen(true);
  });

  // ================= EINSTELLUNGEN =================
  function openSettings() {
    $("sKey").value = cfg.key; $("sModel").value = cfg.model; $("sOrt").value = cfg.ort;
    $("sLimit").value = cfg.limit; $("sSearch").checked = cfg.search; $("sWake").checked = cfg.wake; $("sLook").checked = cfg.look !== false;
    $("sEngine").value = cfg.engine === "google" ? "google" : "vosk"; $("sWakeExtra").value = cfg.wakeExtra || ""; $("sGroq").value = cfg.groqKey || ""; $("sMuteBeep").checked = cfg.muteBeep !== false;
    $("sHaUrl").value = cfg.haUrl; $("sHaToken").value = cfg.haToken; $("sAbout").value = cfg.about; $("sName").value = ich.name || ""; $("sSmart").value = cfg.smart || "";
    const u = usage.tag === heute() ? usage : { n: 0, inTok: 0, outTok: 0 };
    $("sUsage").textContent = `Heute: ${u.n} Anfragen · ${u.inTok.toLocaleString("de-DE")} Tokens rein · ${(u.cacheTok || 0).toLocaleString("de-DE")} günstig aus dem Zwischenspeicher · ${u.outTok.toLocaleString("de-DE")} Tokens raus`;
    $("setPanel").hidden = false;
  }
  $("setBtn").addEventListener("click", openSettings);
  $("setClose").addEventListener("click", () => { $("setPanel").hidden = true; });
  $("setSave").addEventListener("click", () => {
    cfg.key = $("sKey").value.trim(); cfg.model = $("sModel").value; cfg.ort = $("sOrt").value.trim();
    cfg.limit = Math.max(10, Math.min(5000, parseInt($("sLimit").value, 10) || 300));
    cfg.search = $("sSearch").checked; cfg.wake = $("sWake").checked; cfg.look = $("sLook").checked;
    cfg.muteBeep = $("sMuteBeep").checked;
    const engineChanged = !NATIVE && cfg.engine !== $("sEngine").value;
    if (!NATIVE) cfg.engine = $("sEngine").value; cfg.wakeExtra = $("sWakeExtra").value.trim(); WAKE = buildWake(); cfg.groqKey = $("sGroq").value.trim();
    if (engineChanged) {
      if (cfg.engine === "google") { cfg.ear = true; earUI(); hardReset("Ohren gewechselt"); earStart(); }
      else { earPause(); voskPrepareCtx(); if (cfg.ear) voskStart(); }
    }
    cfg.haUrl = $("sHaUrl").value.trim(); cfg.haToken = $("sHaToken").value.trim(); cfg.about = $("sAbout").value.trim().slice(0, 4000); cfg.smart = $("sSmart").value.trim().slice(0, 8000);
    const nm = $("sName").value.trim().slice(0, 40); if (nm !== ich.name) { ich.name = nm; saveIch(); }
    saveCfg(); $("setPanel").hidden = true; note("Gespeichert.", 2000);
  });

  // ================= START =================
  function begruessen(spoken) {
    const h = new Date().getHours();
    const gruss = h < 5 ? "Guten Abend" : h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend";
    const t = ich.name ? `${gruss}, ${ich.name}. Alle Systeme sind bereit.` : `${gruss}. Ich bin Sentinel, dein persönlicher Assistent. Wie heißt du?`;
    lastGreet = Date.now();
    show(""); setMood(ich.name ? "freude" : "ueberrascht");
    if (spoken) speak(t, "neutral"); else setTimeout(() => { if (!busy && !speaking) setMood("neutral"); }, 2000);
    status(cfg.ear ? "hört zu" : "bereit");
  }
  if (!cfg.key) $("keyField").hidden = false;
  if (NATIVE) {
    // In der App braucht es kein "Aufwecken" mehr, wenn der Key schon da ist
    $("startText").textContent = "Willkommen. Trag einmal deinen API-Key ein, danach startet Sentinel automatisch.";
    $("sEngine").closest(".field").hidden = true;
    $("sGroq").closest(".field").hidden = true;
    $("muteBeepRow").hidden = false;
    if (cfg.key) setTimeout(() => $("startBtn").click(), 300);
  }
  $("startBtn").addEventListener("click", async () => {
    const errEl = $("startErr"); errEl.hidden = true;
    if (!cfg.key) {
      const k = $("keyInput").value.trim();
      if (!/^sk-ant-/.test(k)) { errEl.textContent = "Der Key beginnt mit sk-ant-. Du findest ihn auf console.anthropic.com unter API Keys."; errEl.hidden = false; return; }
      cfg.key = k; saveCfg();
    }
    $("startPanel").hidden = true;
    keepAwake();
    // Stimme und Audio SOFORT beim Antippen freischalten – Android erlaubt Ton nur direkt nach einer Berührung
    if (cfg.engine === "vosk") voskPrepareCtx();
    earUI();
    begruessen(true);
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    if (cfg.engine === "vosk" && cfg.ear) voskStart();
    if (NATIVE && cfg.ear) nativeEarsOn();
    if (cfg.eye) await camStart();
    if (cfg.engine === "google" && !SR) note("Dieser Browser kann nicht zuhören. Nimm Chrome.");
  });
  if (!window.isSecureContext) {
    $("startText").textContent = "Achtung: Mikrofon und Kamera gehen nur, wenn die Seite über https geöffnet wird.";
  }
  earUI(); eyeUI(); status("schläft");
})();
</script>
</body>
</html>
