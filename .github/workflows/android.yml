name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # hat das Android-SDK schon an Bord
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Webseite in die App kopieren
        run: npx cap sync android

      - name: App bauen
        run: |
          chmod +x android/gradlew
          cd android
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "error:|What went wrong|Caused by|FAILURE|\.java:[0-9]+|build\.gradle" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sentinel.apk

      - name: Store-Paket (AAB) bauen
        env:
          UPLOAD_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SENTINEL_UPLOAD_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_B64" ]; then echo "Kein Upload-Schlüssel hinterlegt – AAB wird übersprungen"; exit 0; fi
          echo "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export SENTINEL_UPLOAD_STORE="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../Sentinel-Store.aab

      - name: Store-Paket als Datei ablegen
        if: hashFiles('Sentinel-Store.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-Store-AAB
          path: Sentinel-Store.aab

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Sentinel App (neueste Version)
          body: "Neueste Sentinel-App. Auf dem Tablet herunterladen und installieren."
          files: |
            Sentinel.apk
            Sentinel-Store.aab
          fail_on_unmatched_files: false
          make_latest: true
