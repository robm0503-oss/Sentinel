name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Webseite in die App kopieren
        run: npx cap sync android

      - name: App bauen
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sentinel.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Sentinel App (neueste Version)
          body: "Neueste Sentinel-App. Auf dem Tablet herunterladen und installieren."
          files: Sentinel.apk
          make_latest: true
